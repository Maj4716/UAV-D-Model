(()=>{"use strict";const root=document.getElementById("health-app"),$=id=>document.getElementById(id);const fmt=(v,d=3)=>v===null||v===undefined?"—":Number(v).toLocaleString("zh-CN",{maximumFractionDigits:d});const pct=v=>fmt(v*100,2)+"%";const bytes=v=>fmt(v/2**20,1)+" MiB";const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const badge=(text,kind="")=>`<span class="badge ${kind}">${esc(text)}</span>`;
function stat(label,value,context=""){return `<div class="stat"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="context">${esc(context)}</div></div>`}function finding(title,text,kind){return `<div class="finding"><div>${badge(kind,kind==="硬合同"?"good":kind==="科学边界"?"bad":"warn")}</div><h3>${esc(title)}</h3><p>${esc(text)}</p></div>`}
function renderOverview(){const d=REPORT.dataset,t=REPORT.timing?.observations,drv=REPORT.derived_inputs,l=REPORT.labels;$("overview").innerHTML=`<div class="stats">${stat("正式输入",fmt(d.n_total),"N 轴，含拒算")}${stat("有效训练样本",fmt(d.n_valid),`成功率 ${pct(d.n_valid/d.n_total)}`)}${stat("归档体积",bytes(d.disk_bytes),`${fmt(d.shard_count)} 个分片`)}${stat("重建端到端",t?fmt(t.reconstructed_cold_end_to_end_seconds/60,2)+" 分":"—","含计划冻结与正式归档")}</div><div class="grid2"><div class="panel"><h2>样本漏斗与切分</h2><div class="funnel"><div><strong>${fmt(REPORT.sampling.archive_summary.planned_candidate_count)}</strong>计划候选</div><div><strong>${fmt(REPORT.sampling.archive_summary.executed_candidate_count)}</strong>已执行</div><div><strong>${fmt(d.n_valid)}</strong>成功</div><div><strong>${fmt(d.purpose_admission_counts.research_training||0)}</strong>研究训练准入</div></div><div class="stack" aria-label="训练1600，验证200，测试200"><span class="train" style="width:${d.split_counts.train/d.n_valid*100}%">train ${fmt(d.split_counts.train)}</span><span class="validation" style="width:${d.split_counts.validation/d.n_valid*100}%">val ${fmt(d.split_counts.validation)}</span><span class="test" style="width:${d.split_counts.test/d.n_valid*100}%">test ${fmt(d.split_counts.test)}</span></div><p class="small muted">切分数量正确不等于现实独立性成立；manifest 明确 independence_guaranteed=false。</p></div><div class="panel"><h2>最影响学习结果的事实</h2>${finding("输入变化维度很窄",`${drv.feature_count} 个工况特征中只有 ${drv.variable_feature_count} 个变化；起爆半径固定为 2 m。若要跨距离、源项、环境或目标泛化，这批数据不能提供相应监督。`,"描述性")}${finding("标签存在显著平台",`${l[0].name} 的众数占 ${pct(l[0].mode_fraction)}；${l[1].name} 的众数占 ${pct(l[1].mode_fraction)}。大量相同软标签会降低梯度多样性。`,"描述性")}${finding("重复数只有 2",`全部 ${fmt(d.n_valid)} 条样本均为 2 次重复。区间可计算不等于估计稳定；最大系统标签半宽达到 ${fmt(Math.max(...l.map(x=>x.ci_half_width.max)),3)}。`,"描述性")}${finding("不能用于研究训练放行",`未验证参数比例 ${pct(d.unverified_parameter_fraction)}，research_training 准入数为 0。软件档案完整不能替代物理标定。`,"科学边界")}</div></div>`}
let featureFilter="all";function renderInputs(){const drv=REPORT.derived_inputs;$("inputs").innerHTML=`<div class="stats">${stat("工况特征",fmt(drv.feature_count),"case_physics_x")}${stat("实际变化",fmt(drv.variable_feature_count),pct(drv.variable_feature_count/drv.feature_count))}${stat("固定/常量",fmt(drv.constant_feature_count),pct(drv.constant_feature_count/drv.feature_count))}${stat("起爆半径",fmt(drv.detonation_radius_m.median,6)+" m","本批次固定")}</div><div class="notice"><strong>如何解释：</strong>固定源项/环境/目标若就是部署域，并非数据错误；但网络无法从未变化的维度学习响应关系，也不能把固定域内拟合外推到新距离、新源项或新目标。</div><div class="panel"><div class="filterbar" role="group" aria-label="特征筛选"><button data-feature-filter="all" aria-pressed="true">全部</button><button data-feature-filter="variable" aria-pressed="false">仅变化</button><button data-feature-filter="constant" aria-pressed="false">仅固定</button></div><div class="tableWrap"><table><thead><tr><th>特征</th><th>单位</th><th>状态</th><th>唯一值</th><th>最小</th><th>中位</th><th>最大</th><th>最大 |SMD|</th></tr></thead><tbody id="feature-rows"></tbody></table></div></div><div class="grid2" style="margin-top:22px"><div class="panel"><h3>派生几何检查</h3><p>起爆半径：min ${fmt(drv.detonation_radius_m.min,7)} / median ${fmt(drv.detonation_radius_m.median,7)} / max ${fmt(drv.detonation_radius_m.max,7)} m</p><p>四元数范数：min ${fmt(drv.quaternion_norm.min,7)} / median ${fmt(drv.quaternion_norm.median,7)} / max ${fmt(drv.quaternion_norm.max,7)}</p><p class="small muted">数值误差范围内满足 2 m 球壳与单位四元数约束。</p></div><div class="panel"><h3>实际变化的 7 个特征</h3><p>${drv.variable_feature_names.map(n=>`<code>${esc(n)}</code>`).join(" · ")}</p><p class="small muted">位置 3 维和姿态四元数 4 分量来自 5 个独立 latent 轴；四元数 4 分量不等于 4 个独立自由度。</p></div></div>`;renderFeatureRows()}
function renderFeatureRows(){const rows=REPORT.features.filter(f=>featureFilter==="all"||(featureFilter==="constant")==f.constant);$("feature-rows").innerHTML=rows.map(f=>`<tr><td><code>${esc(f.name)}</code></td><td>${esc(f.unit)}</td><td>${f.constant?badge("固定","warn"):badge("变化","good")}</td><td class="num">${fmt(f.unique,0)}</td><td class="num">${fmt(f.stats.min,5)}</td><td class="num">${fmt(f.stats.median,5)}</td><td class="num">${fmt(f.stats.max,5)}</td><td class="num">${fmt(f.max_abs_split_smd,3)}</td></tr>`).join("");root.querySelectorAll("[data-feature-filter]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.featureFilter===featureFilter)))}
let labelIndex=0;function renderLabels(){const options=REPORT.labels.map((l,i)=>`<option value="${i}">${esc(l.name)}</option>`).join("");$("labels").innerHTML=`<div class="labelHead"><div><h2>系统任务：多标签事件概率</h2><p class="muted">两个输出可同时成立，不能用 softmax 强制和为 1。</p></div><label>选择输出 <select id="label-select">${options}</select></label></div><div id="label-summary"></div><div class="grid2"><div class="panel"><h3>软标签分布</h3><div id="histogram" class="chart" role="img" aria-label="所选系统标签的概率直方图"></div></div><div class="panel"><h3>各切分均值</h3><div id="split-means" class="splitRows"></div><p class="small muted">这是结果后的描述性对照；不可据此反向调整已冻结的 validation/test。</p></div></div><div class="notice"><strong>梯度信号提示：</strong><span id="label-note"></span></div>`;const sel=$("label-select");sel.value=String(labelIndex);sel.addEventListener("change",()=>{labelIndex=Number(sel.value);renderLabelDetail()});renderLabelDetail()}
function renderLabelDetail(){const l=REPORT.labels[labelIndex];$("label-summary").innerHTML=`<div class="stats">${stat("均值",fmt(l.stats.mean,4),"soft target")}${stat("标准差",fmt(l.stats.std,4),`${fmt(l.unique)} 个唯一值`)}${stat("众数占比",pct(l.mode_fraction),`值 ${fmt(l.mode_value,4)}`)}${stat("CI 非零",pct(l.ci_nonzero_fraction),`≥0.25：${pct(l.ci_half_width_ge_025_fraction)}`)}</div>`;$("split-means").innerHTML=Object.entries(l.split).map(([s,v])=>`<div class="splitRow"><span>${esc(s)}</span><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,v.mean*100))}%"></div></div><span class="barValue">${fmt(v.mean,4)}</span></div>`).join("");$("label-note").textContent=`${l.name} 有 ${fmt(l.unique)} 个唯一值，但 ${pct(l.mode_fraction)} 样本落在同一众数。模型可能用平台常数迅速降低平均损失，却在少数变化区间表现较差；应按标签区间报告误差，而不只看总体 MSE/BCE。`;drawHistogram(l)}
let ro;function drawHistogram(l){const box=$("histogram"),w=Math.max(320,Math.floor(box.clientWidth||680)),h=280,m={l:54,r:18,t:18,b:48},counts=l.histogram.counts,max=Math.max(...counts,1),bw=(w-m.l-m.r)/counts.length,sy=v=>m.t+(h-m.t-m.b)*(1-v/max);let svg=`<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><line class="grid" x1="${m.l}" x2="${w-m.r}" y1="${h-m.b}" y2="${h-m.b}"/><line class="grid" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${h-m.b}"/>`;counts.forEach((c,i)=>{const y=sy(c);svg+=`<rect class="bar" x="${m.l+i*bw+1}" y="${y}" width="${Math.max(1,bw-2)}" height="${h-m.b-y}"><title>${(i/20).toFixed(2)}–${((i+1)/20).toFixed(2)}: ${c}</title></rect>`});for(let i=0;i<=4;i++){const x=m.l+(w-m.l-m.r)*i/4;svg+=`<text x="${x}" y="${h-22}" text-anchor="middle">${(i/4).toFixed(2)}</text>`}svg+=`<text class="axisTitle" x="${(m.l+w-m.r)/2}" y="${h-4}" text-anchor="middle">合成教师概率</text><text class="axisTitle" x="14" y="${h/2}" transform="rotate(-90 14 ${h/2})" text-anchor="middle">样本数</text><text x="${m.l-8}" y="${m.t+4}" text-anchor="end">${max}</text><text x="${m.l-8}" y="${h-m.b+4}" text-anchor="end">0</text></svg>`;box.innerHTML=svg;if(!ro){ro=new ResizeObserver(()=>drawHistogram(REPORT.labels[labelIndex]));ro.observe(box)}}
function renderMasks(){const m=REPORT.masks;$("masks").innerHTML=`<div class="maskGrid">${Object.entries(m).map(([k,v])=>`<div class="maskItem"><code>${esc(k)}</code><br><strong>${pct(v)}</strong></div>`).join("")}</div><div class="grid2" style="margin-top:24px"><div class="panel"><h2>重复数</h2>${Object.entries(REPORT.replicate_counts).map(([n,c])=>`<p><strong>${fmt(c)}</strong> 条样本使用 <strong>${esc(n)}</strong> 次重复</p>`).join("")}<div class="notice"><strong>注意：</strong>uncertainty mask=100% 仅表示 n≥2 且数值可计算，不表示 2 次重复足以稳定估计 95% 区间。</div></div><div class="panel"><h2>系统标签 CI 半宽</h2>${REPORT.labels.map(l=>`<div class="finding"><h3>${esc(l.name)}</h3><p>median ${fmt(l.ci_half_width.median,5)} · p95 ${fmt(l.ci_half_width.p95,5)} · p99 未作为放行门槛 · max ${fmt(l.ci_half_width.max,3)}</p><p class="small muted">非零 ${pct(l.ci_nonzero_fraction)}；半宽≥0.25 ${pct(l.ci_half_width_ge_025_fraction)}</p></div>`).join("")}</div></div><div class="notice bad"><strong>不要这样处理：</strong>mask=false 的占位数不能当作 0 标签；MC CI 也不是现实预测区间。Fréchet 机制依赖上下界与 MC CI 是不同对象，不能合并成一个“置信区间”。</div>`}
function gate(name,value,threshold,pass){return `<div class="gate"><span>${esc(name)}</span><span class="num">${esc(value)}</span><span>${badge(pass?"通过":"失败",pass?"good":"bad")}</span></div>`}function renderSampling(){const s=REPORT.sampling,d=REPORT.dataset,du=REPORT.duplicates,g=s.quality_gates;$("sampling").innerHTML=`<div class="stats">${stat("ESS",fmt(s.effective_sample_size,1),`fraction ${fmt(s.ess_fraction,3)}`)}${stat("入选概率",fmt(s.positivity_min,3),"min=max")}${stat("权重 CV",fmt(s.weight_cv,3),"原始 1/ρ")}${stat("跨 split 重复",fmt(du.cross_split_duplicates),"精确工况指纹")}</div><div class="grid2"><div class="panel"><h2>预声明采样门槛</h2>${gate(`positivity ≥ ${g.positivity_min}`,fmt(s.positivity_min,3),g.positivity_min,s.positivity_min>=g.positivity_min)}${gate(`ESS fraction ≥ ${g.min_ess_fraction}`,fmt(s.ess_fraction,3),g.min_ess_fraction,s.ess_fraction>=g.min_ess_fraction)}${gate(`weight CV ≤ ${g.max_weight_cv}`,fmt(s.weight_cv,3),g.max_weight_cv,s.weight_cv<=g.max_weight_cv)}<p class="small muted">这些门槛只检查设计权重数值与声明分组；设计权重不是类别权重或 minibatch 概率。</p></div><div class="panel"><h2>切分与候选身份</h2><p>唯一工况指纹 ${fmt(du.unique_input_fingerprints)}；split 内重复 ${fmt(du.within_split_duplicates)}；跨 split 重复 ${fmt(du.cross_split_duplicates)}。</p><p>manifest leakage audit：${badge(String(d.split_policy.leakage_audit_passed),d.split_policy.leakage_audit_passed?"good":"bad")}</p><p>registry：${badge("frozen_pre_outcome","good")}</p><p class="small muted">无精确重复和声明组隔离通过，仍不证明现实研究单位独立。</p></div></div><div class="panel" style="margin-top:22px"><h2>5 个 latent 轴的设计覆盖（描述性）</h2>${s.latent_ks.map((v,i)=>`<div class="barRow"><code>latent_${i}</code><div class="track"><div class="fill" style="width:${Math.min(100,s.latent_occupancy[i]*100)}%"></div></div><span class="barValue">KS ${fmt(v,6)}</span></div>`).join("")}<p class="small muted">10 箱占用率均为 100%；coverage_status=${esc(s.coverage_status)}。这不是预先声明的覆盖放行协议，coverage_guaranteed=false。</p></div>`}
function renderScale(){const t=REPORT.timing?.observations,p=REPORT.timing?.projection_300000_same_configuration;if(!t||!p){$("scale").innerHTML="<p>未提供 timing JSON。</p>";return}const max=p.capacity_planning_range_hours[1];$("scale").innerHTML=`<div class="stats">${stat("成功正式段",fmt(t.successful_resume_generation_seconds_stopwatch/60,2)+" 分",`${fmt(t.formal_generation_cases_per_second,3)} 条/秒`)}${stat("重建端到端",fmt(t.reconstructed_cold_end_to_end_seconds/60,2)+" 分",`${fmt(t.reconstructed_end_to_end_cases_per_second,3)} 条/秒`)}${stat("30 万线性基准",fmt(p.full_pipeline_linear_hours,1)+" 小时","相同配置")}${stat("规划区间",`${fmt(p.capacity_planning_range_hours[0],1)}–${fmt(p.capacity_planning_range_hours[1],1)} 小时`,"+20% 至 +50%")}</div><div class="projection"><div class="panel"><h2>时间外推</h2><div class="scaleLine"><p>正式计算线性：${fmt(p.formal_generation_linear_hours,2)} h</p><div class="track"><div class="fill" style="width:${p.formal_generation_linear_hours/max*100}%"></div></div></div><div class="scaleLine"><p>全流程线性：${fmt(p.full_pipeline_linear_hours,2)} h</p><div class="track"><div class="fill" style="width:${p.full_pipeline_linear_hours/max*100}%"></div></div></div><div class="scaleLine"><p>容量规划上界：${fmt(max,2)} h</p><div class="track"><div class="fill" style="width:100%"></div></div></div><p class="small muted">相同机器、8 workers、2 replicates、250/片、压缩写入。不是 SLA。</p></div><div class="panel"><h2>磁盘外推</h2><p>本批实际：<strong>${bytes(t.archive_bytes)}</strong>，约 ${fmt(t.archive_bytes_per_case/1024,1)} KiB/条。</p><p>30 万线性：<strong>${fmt(p.linear_archive_gib,1)} GiB</strong></p><p>建议预留：<strong>${fmt(p.storage_planning_range_gib[0],0)}–${fmt(p.storage_planning_range_gib[1],0)} GiB</strong></p><div class="notice"><strong>容量风险：</strong>固定 250/片将产生约 1200 个分片。全局元数据 O(N)，累计 checkpoint 重写可能产生超线性 I/O，真实用时可能超过规划区间。</div></div></div><div class="panel" style="margin-top:22px"><h2>建议的规模放行阶梯</h2><ol><li>先保留本次 2000 条作为软件基线。</li><li>同配置执行 10,000 条，测吞吐、峰值内存、checkpoint 时间占比和磁盘增长。</li><li>再做 50,000 条；若吞吐明显下降，增大 shard_size 或改变 checkpoint 元数据策略后重测。</li><li>只有趋势稳定后，才把 30 万规划值转成执行预算。</li></ol></div>`}
function show(tab){root.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));["overview","inputs","labels","masks","sampling","scale"].forEach(id=>$(id).hidden=id!==tab);if(tab==="labels")requestAnimationFrame(()=>drawHistogram(REPORT.labels[labelIndex]))}root.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.tab)show(b.dataset.tab);if(b.dataset.featureFilter){featureFilter=b.dataset.featureFilter;renderFeatureRows()}});root.querySelector('[role="tablist"]').addEventListener("keydown",e=>{if(!["ArrowLeft","ArrowRight","Home","End"].includes(e.key))return;const tabs=[...root.querySelectorAll("[data-tab]")],i=tabs.indexOf(e.target);if(i<0)return;const n=e.key==="Home"?0:e.key==="End"?tabs.length-1:(i+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length;e.preventDefault();tabs[n].focus();show(tabs[n].dataset.tab)});
$("evidence-body").innerHTML=`<ul><li>完整归档先经 TorchShardedDamageDataset 校验：状态、根 manifest、所有分片、哈希、dtype、shape、mask、词表与 split 语义；audit_overrides=${esc(JSON.stringify(REPORT.dataset.audit_overrides))}。</li><li>硬合同：${esc(REPORT.interpretation.hard_contract)}</li><li>预声明门槛：${esc(REPORT.interpretation.declared_gate)}</li><li>描述性：${esc(REPORT.interpretation.descriptive)}</li><li>科学边界：${esc(REPORT.interpretation.scientific_boundary)}</li></ul>`;$("footer").textContent=`${REPORT.dataset.dataset_id} · manifest ${REPORT.dataset.manifest_version} · tensor ${REPORT.dataset.tensor_contract_version} · 生成日期 ${REPORT.generated_at} · 单文件离线报告`;renderOverview();renderInputs();renderLabels();renderMasks();renderSampling();renderScale();show("overview")})();</script></body></html>
